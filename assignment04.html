<!doctype html>
<html lang="en">
  <head>
    <title>EXPERIMENT-4</title>
    <style>
      body {
        font-family: "Times New Roman", serif;
        margin: 0;
        padding: 20px;
      }
      .student-info {
        position: fixed;
        top: 8px;
        left: 10px;
        font-size: 14px;
        font-weight: bold;
      }
      .form-container {
        width: 600px;
        max-width: 100%;
        margin: 50px auto 0;
        padding: 20px;
        border: 2px solid #000;
        text-align: center;
      }
      h1 {
        margin-top: 0;
      }
      .form-row {
        margin: 15px 0;
      }
      textarea {
        width: 90%;
        height: 100px;
        margin-top: 8px;
      }
      .buttons {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="student-info">
      Admission No: 2026B01010967 <br />
      Name: PRINCE THAKUR<br />
    </div>

    <div class="form-container">
      <h1>Hotel Room Booking Form</h1>

      <form action="#" method="post">
        <div class="form-row">
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" size="40" required />
        </div>

        <div class="form-row">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" size="40" required />
        </div>

        <div class="form-row">
          <label for="phone">Phone:</label>
          <input type="tel" id="phone" name="phone" size="40" required />
        </div>

        <div class="form-row">
          <label for="checkin">Check-in Date:</label>
          <input type="date" id="checkin" name="checkin" required />
        </div>

        <div class="form-row">
          <label for="checkout">Check-out Date:</label>
          <input type="date" id="checkout" name="checkout" required />
        </div>

        <div class="form-row">
          <label for="roomtype">Room Type:</label>
          <select id="roomtype" name="roomtype">
            <option value="single">Single Room</option>
            <option value="double">Double Room</option>
            <option value="suite">Suite</option>
          </select>
        </div>

        <div class="form-row">
          <label for="guests">Number of Guests:</label>
          <input type="number" id="guests" name="guests" min="1" max="10" />
        </div>

        <div class="form-row">
          <label for="requests">Special Requests:</label><br />
          <textarea id="requests" name="requests"></textarea>
        </div>

        <div class="buttons">
          <button type="submit">Book Now</button>
          <button type="reset">Reset Form</button>
        </div>
      </form>
    </div>
  </body>
</html>
