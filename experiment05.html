<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>HTML Form</title> 
    <link rel="stylesheet" href="experiment05.css">
</head> 
<body> 
    <form> 
        <fieldset> 
            <legend>User Personal Information</legend>
            <label for="name">Enter your full name:</label> 
            <input type="text" id="name" name="name" required><br> 
            <label for="email">Enter your email:</label> 
            <input type="email" id="email" name="email" required><br> 
            <label for="password">Enter your password:</label> 
            <input type="password" id="password" name="pass" placeholder="Enter your password" required><br> 
            <label for="confirmPassword">Confirm your password:</label> 
            <input type="password" id="confirmPassword" name="confirmPass" required /> <br><br> 
 <select> 
    <!-- option tag starts --> 
    <option>Choose an option</option> 
    <option value="html">HTML</option> 
    <option value="java">JAVA</option> 
    <option value="C++">C++</option> 
    <option value="php">PHP</option> 
    <!-- option tag ends --> 
  </select> 
  <label>Enter your gender:</label> 
            <div class="gender-group"> 
                <input type="radio" name="gender" value="male" id="male" required /> 
                <label for="male">Male</label> 
                <input type="radio" name="gender" value="female" id="female" /> 
                <label for="female">Female</label> 
                <input type="radio" name="gender" value="others" id="others" /> 
                <label for="others">Others</label> 
            </div> 
<br> 
            <label for="dob">Enter your Date of Birth:</label> 
            <input type="date" id="dob" name="dob" required /><br/> 
            <label for="address">Enter your Address:</label> 
            <textarea id="address" name="address" required></textarea> 
<br> 
             <label>Student Name:</label>
        <input type="text" name="studentname">
        <br><br>

        <label>Upload PDF:</label>
        <input type="file" name="document" accept=".pdf">
        <br><br>

        <label>Upload Image:</label>
        <input type="file" name="photo" accept="image/*">
        <br><br>
            <input type="submit" value="Submit" /> 
        </fieldset> 
    </form> 
    <p>
      Name: Prince Thakur
      <br>
      Admission Number: 2026B01010967
    </p>
</body> 
</html>
